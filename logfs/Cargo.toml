[package]
name = "logfs"
description = "Simple append-only log based filesystem with encryption and compression"

version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
backtrace = "0.3"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
# bincode 3.0.0 is intentionally non-buildable; 2 is the latest usable major.
bincode = { version = "2", features = ["serde"] }
bitflags = { version = "2", features = ["serde"] }
brotli = "9"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
generic-array = "1"
fs2 = "0.4"
hmac = "0.13"
hkdf = "0.13"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tracing = "0.1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "reliability"
harness = false
